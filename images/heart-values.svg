<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">ZooSay HEART values</title>
  <desc id="d">Our five values: Honest, Earnest, Animal-kind, Respectful and Trusted, spelling HEART.</desc>
  <rect width="1200" height="260" fill="#0F4A2A"/>
  <text x="600" y="48" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, Arial, sans-serif" font-weight="800" font-size="26" fill="#FFCE2E" letter-spacing="2">HOW WE WORK: HEART</text>
  <g font-family="Baloo 2, Trebuchet MS, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="40" y="72" width="200" height="164" rx="26" fill="#FFFFFF" stroke="#173B24" stroke-width="4"/>
      <circle cx="140" cy="122" r="38" fill="#FFCE2E" stroke="#173B24" stroke-width="4"/>
      <text x="140" y="137" font-size="42" font-weight="800" fill="#0F4A2A">H</text>
      <text x="140" y="208" font-size="24" font-weight="800" fill="#173B24">Honest</text>
    </g>
    <g>
      <rect x="270" y="72" width="200" height="164" rx="26" fill="#FFFFFF" stroke="#173B24" stroke-width="4"/>
      <circle cx="370" cy="122" r="38" fill="#FFCE2E" stroke="#173B24" stroke-width="4"/>
      <text x="370" y="137" font-size="42" font-weight="800" fill="#0F4A2A">E</text>
      <text x="370" y="208" font-size="24" font-weight="800" fill="#173B24">Earnest</text>
    </g>
    <g>
      <rect x="500" y="72" width="200" height="164" rx="26" fill="#FFFFFF" stroke="#173B24" stroke-width="4"/>
      <circle cx="600" cy="122" r="38" fill="#FFCE2E" stroke="#173B24" stroke-width="4"/>
      <text x="600" y="137" font-size="42" font-weight="800" fill="#0F4A2A">A</text>
      <text x="600" y="208" font-size="24" font-weight="800" fill="#173B24">Animal-kind</text>
    </g>
    <g>
      <rect x="730" y="72" width="200" height="164" rx="26" fill="#FFFFFF" stroke="#173B24" stroke-width="4"/>
      <circle cx="830" cy="122" r="38" fill="#FFCE2E" stroke="#173B24" stroke-width="4"/>
      <text x="830" y="137" font-size="42" font-weight="800" fill="#0F4A2A">R</text>
      <text x="830" y="208" font-size="24" font-weight="800" fill="#173B24">Respectful</text>
    </g>
    <g>
      <rect x="960" y="72" width="200" height="164" rx="26" fill="#FFFFFF" stroke="#173B24" stroke-width="4"/>
      <circle cx="1060" cy="122" r="38" fill="#FFCE2E" stroke="#173B24" stroke-width="4"/>
      <text x="1060" y="137" font-size="42" font-weight="800" fill="#0F4A2A">T</text>
      <text x="1060" y="208" font-size="24" font-weight="800" fill="#173B24">Trusted</text>
